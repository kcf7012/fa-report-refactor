name: Tests

# 觸發條件:push 到 main/develop + 所有 PR
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 允許 workflow_dispatch 手動觸發
  workflow_dispatch:

# 取消相同 workflow 的舊執行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow 級環境變數(全 jobs 可用)
env:
  UV_VERSION: "0.5"
  PYTHON_DEFAULT: "3.10"

jobs:
  # ============================================
  # Lint 與格式檢查(快速失敗)
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: uv sync --extra dev --extra llm

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Black format check
        run: uv run black --check src/ tests/ scripts/

  # ============================================
  # 測試(主要,Python 矩陣)
  # ============================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra llm --python ${{ matrix.python-version }}

      - name: Create test fixtures
        # CI 環境沒有 report/*.pptx(被 .gitignore 排除),需動態建立
        run: |
          mkdir -p report
          uv run python -c "
          from pptx import Presentation
          import json
          from pathlib import Path
          # 建立測試 pptx(有母片 + 2 個 layouts)
          prs = Presentation()
          slide = prs.slides.add_slide(prs.slide_layouts[0])
          slide.shapes.title.text = 'Test FA Report'
          prs.save('report/test_sample.pptx')
          # 建立測試 eval JSON
          Path('report/test_eval.json').write_text(json.dumps({
              'total_score': 70.0,
              'grade': 'C',
              'dimensions': {
                  '基本資訊完整性': {'score': 60, 'weight': 15, 'comment': '需補充填寫'},
                  '問題描述與定義': {'score': 70, 'weight': 15, 'comment': 'OK'},
                  '分析方法與流程': {'score': 75, 'weight': 20, 'comment': 'OK'},
                  '數據與證據支持': {'score': 70, 'weight': 20, 'comment': 'OK'},
                  '根因分析': {'score': 60, 'weight': 20, 'comment': '需加強'},
                  '改善對策': {'score': 80, 'weight': 10, 'comment': 'OK'},
              },
              'improvements': [{'item': '基本資訊', 'suggestion': '補充填寫', 'priority': 'HIGH'}],
              'summary': '測試報告',
              'strengths': ['完整分析'],
          }, ensure_ascii=False), encoding='utf-8')
          # 建立測試 eval TXT
          Path('report/test_eval.txt').write_text('''FA 報告評估結果
          總分:70
          等級:C
          ''', encoding='utf-8')
          print('✅ Fixtures created')
          "

      - name: Run test suite
        run: |
          uv run pytest tests/ \
            --cov=fa_improver \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q

      - name: Check master protection (母片保護)
        run: |
          echo "=== 母片保護驗證 ==="
          uv run pytest tests/unit/test_master_protection.py -v

      - name: Verify CLI entry point
        run: |
          echo "=== CLI 驗證 ==="
          uv run python -m fa_improver --help
          uv run fa-improve --help

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage report
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ============================================
  # Build distribution(僅 main 分支 / tag)
  # ============================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    # 僅在 main 分支或 tag 推送時執行
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_DEFAULT }}

      - name: Install build dependencies
        run: uv sync --extra dev

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Verify package metadata
        run: |
          echo "=== Package metadata ==="
          uv run python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print('Name:', data['project']['name'])
          print('Version:', data['project']['version'])
          print('Requires Python:', data['project']['requires-python'])
          "
