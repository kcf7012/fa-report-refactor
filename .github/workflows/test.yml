name: Tests

# 觸發條件:push 到 main/develop + 所有 PR
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 取消相同 workflow 的舊執行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  UV_VERSION: "0.5"

jobs:
  # ============================================
  # Lint 與格式檢查(快速失敗)
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --extra llm

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/ || true

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/ || true

      - name: Black format check
        run: uv run black --check src/ tests/ scripts/ || true

  # ============================================
  # 測試(主要)
  # ============================================
  test:
    name: Test Suite (Python ${{ env.PYTHON_VERSION }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra llm --python ${{ matrix.python-version }}

      - name: Run test suite
        run: |
          uv run pytest tests/ \
            --cov=fa_improver \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q

      - name: Check master protection (母片保護)
        run: |
          echo "=== 母片保護驗證 ==="
          uv run pytest tests/unit/test_master_protection.py -v

      - name: Verify CLI entry point
        run: |
          echo "=== CLI 驗證 ==="
          uv run python -m fa_improver --help
          uv run fa-improve --help

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage report
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ============================================
  # Pre-commit hooks(若配置)
  # ============================================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 僅在 .pre-commit-config.yaml 存在時執行
    continue-on-error: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get pre-commit cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # ============================================
  # Build distribution(僅 main 分支)
  # ============================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    # 僅在 main 分支或 tag 推送時執行
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: uv sync --extra dev

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Verify package metadata
        run: |
          echo "=== Package metadata ==="
          uv run python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print('Name:', data['project']['name'])
          print('Version:', data['project']['version'])
          print('Requires Python:', data['project']['requires-python'])
          "

  # ============================================
  # 整合測試(可選,需要 secrets)
  # ============================================
  integration:
    name: Integration Tests (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    # 僅在有 OPENAI_API_KEY secret 時執行
    if: env.OPENAI_API_KEY != ''
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --extra llm

      - name: Run LLM integration test (mock)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python -c "
          from fa_improver.llm.openai_client import OpenAIClient
          from fa_improver.llm.redact import redact_pii
          print('LLM client with redact:', OpenAIClient(redact_pii_before_send=True).redact_pii_before_send)
          print('Redact sample:', redact_pii('張三 0912-345-678'))
          "
