# Pre-commit hooks for fa-improver
# 安裝: pip install pre-commit && pre-commit install
# 手動執行: pre-commit run --all-files

repos:
  # Python 程式碼格式與 lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # v3.1.4 修正:從 v0.1.9 升級,與本機 ruff 對齊
    # 舊版 hook 行為跟本機不一致,曾造成 6 個 import 排序問題被 commit 進去,
    # CI 才抓到(見 PR #1 Lint & Format 失敗)。升級後本機與 CI 行為一致。
    # v3.1.5:與 pyproject.toml 的 ruff pin 及 uv.lock 同步為 0.16.6。
    rev: v0.16.6
    hooks:
      # Lint 檢查(快速)
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # 格式化
      - id: ruff-format
        types_or: [python, pyi]

  # Black 格式化(已停用,與 ruff-format 衝突且 ruff-format 是主要格式器)
  # - repo: https://github.com/psf/black
  #   rev: 23.12.1
  #   hooks:
  #     - id: black
  #       language_version: python3
  #       types_or: [python]

  # 基本檔案檢查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # v3.1.5:v4.5.0(2023)→ v6.0.0。舊版使用已棄用的 stage 名稱(commit/push),
    # 每次執行都會警告。
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [python, markdown, yaml, json]
      - id: end-of-file-fixer
        types_or: [python, markdown, yaml, json]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # pytest 必須通過(母片保護 + 全套測試)
  - repo: local
    hooks:
      - id: pytest
        name: pytest(母片保護 + 全套測試)
        # v3.1.5:原本寫死 .venv/bin/python —— 這是全 repo 唯一假設 venv 內部
        # 佈局的地方,POSIX-only 且 venv 換位置就失效。uv run 在 macOS /
        # Linux / Windows 都正確;--frozen 保證用 lock 內容,不會偷偷改 lock。
        entry: uv run --frozen pytest tests/ -q --tb=short
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
